name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. DCO sign-off check ────────────────────────────────────────────────
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Check Signed-off-by on all commits
        run: |
          MISSING=""
          while IFS= read -r commit; do
            MESSAGE=$(git log --format="%B" -n 1 "$commit")
            if ! echo "$MESSAGE" | grep -q "Signed-off-by:"; then
              MISSING="$MISSING\n  - $commit"
            fi
          done < <(git log --format="%H" origin/main..HEAD 2>/dev/null || git log --format="%H" -1)
 
          if [ -n "$MISSING" ]; then
            echo "✗ The following commits are missing a Signed-off-by line:"
            echo -e "$MISSING"
            echo ""
            echo "Fix with: git commit --amend -s --no-edit && git push --force"
            exit 1
          fi
 
          echo "✓ All commits have a Signed-off-by line"
  # ── 2. Lint & type-check ─────────────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ── 3. Build & test (Node matrix) ────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

  # ── 4. Publish dry-run (PRs only) ────────────────────────────────────────
  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm publish --dry-run
